name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The droplet has 512 MB: it runs these artifacts, it never builds.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/api/dist
            apps/api/migrations
            apps/web/dist
